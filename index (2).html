<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sabor & Clic</title>
</head>
<body>
    <!-- Área onde o JavaScript vai criar os cards -->
    <h1>Cardápio</h1>
    <div id="cardapio"></div>

    <!-- Área onde o JavaScript vai mostrar o carrinho -->
    <h1>Carrinho</h1>
    <div id="carrinho"></div>
    <div id="total"></div>

    <!-- Formulário do pedido -->
    <h1>Finalizar pedido</h1>
    <form id="formPedido">
        <input type="text" id="nome" placeholder="Digite seu nome">
        <input type="email" id="email" placeholder="Digite seu e-mail">
        <button type="submit">Finalizar pedido</button>
    </form>

    <!-- Ligação com o arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
